<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IntelliAgri Bio (智农科技)</title>
  <style>
    * { box-sizing: border-box; }

    html, body { height: 100%; }
    body {
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    /* PDF 全屏容器 */
    .pdf-wrapper {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #fff;
    }

    /* iframe 拉满 */
    #cv-pdf {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* 标题悬浮层 */
    h1 {
      position: absolute;
      top: 10px;
      left: 16px;
      z-index: 10;
      margin: 0;
      padding: 4px 10px;
      font-size: 16px;
      color: #333;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 4px;
      pointer-events: none;
    }

    /* 返回按钮悬浮右下角 */
    .back-btn {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 10;
      padding: 8px 16px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
      color: #333;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    }
    .back-btn:hover { background: #f0f0f0; }
  </style>
</head>
<body>
  <div class="pdf-wrapper">
    <h1>IntelliAgri Bio (智农科技) (Updated: 2026/10/26)</h1>
    <iframe id="cv-pdf"
            src="./pdf/IntelliAgri.pdf#toolbar=0&navpanes=0&view=FitH"
            title="IntelliAgri Bio PDF"></iframe>
  </div>
  <a href="index.html" class="back-btn">← Back to Home</a>
</body>
</html>
