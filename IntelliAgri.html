<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IntelliAgri Bio (智农科技)</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #f5f5f5; font-family: Arial, sans-serif; overflow: hidden; }

    .pdf-wrapper {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      background: #fff;
    }

    h1 {
      flex: 0 0 auto;
      margin: 0; padding: 8px 14px;
      font-size: 15px; color: #333;
      background: #fff; border-bottom: 1px solid #eee;
    }

    /* 关键：这一层才是滚动容器 */
    #pages {
      flex: 1 1 auto;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;  /* iOS 顺滑滚动 */
      background: #e9e9e9;
      padding: 8px;
      scroll-behavior: smooth;
    }

    #pages canvas {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto 8px;
      background: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,.15);
    }

    .back-btn {
      position: fixed; left: 16px; bottom: 16px; z-index: 10;
      padding: 8px 16px; background: #fff; border: 1px solid #ddd;
      border-radius: 6px; color: #333; text-decoration: none;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
    }

    #tip { padding: 12px; color: #666; font-size: 13px; }
  </style>
</head>
<body>
  <div class="pdf-wrapper">
    <h1>IntelliAgri Bio (智农科技) (Updated: 2026/10/26)</h1>
    <div id="pages"><p id="tip">PDF 加载中…</p></div>
  </div>
  <a href="index.html" class="back-btn">← Back to Home</a>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    const PDF_URL = './pdf/IntelliAgri.pdf';

    // 必须配 worker，否则 pdf.js 会退化成主线程渲染、很慢
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const box = document.getElementById('pages');
    const tip = document.getElementById('tip');

    async function renderPdf() {
      const pdf = await pdfjsLib.getDocument(PDF_URL).promise;
      box.innerHTML = '';                       // 清掉“加载中”

      const cssWidth = box.clientWidth - 16;    // 容器可用宽度（减 padding）
      const dpr = window.devicePixelRatio || 1; // 高清屏清晰度

      for (let n = 1; n <= pdf.numPages; n++) {
        const page = await pdf.getPage(n);
        const base = page.getViewport({ scale: 1 });
        const scale = (cssWidth / base.width) * dpr;
        const viewport = page.getViewport({ scale });

        const canvas = document.createElement('canvas');
        canvas.width  = viewport.width;           // 像素尺寸
        canvas.height = viewport.height;
        canvas.style.width  = cssWidth + 'px';    // CSS 尺寸
        canvas.style.height = (viewport.height / dpr) + 'px';
        canvas.setAttribute('data-page', n);
        box.appendChild(canvas);

        await page.render({
          canvasContext: canvas.getContext('2d'),
          viewport
        }).promise;
      }
    }

    renderPdf().catch(err => {
      tip.textContent = 'PDF 加载失败：' + err.message;
      box.appendChild(tip);
    });
  </script>
</body>
</html>
